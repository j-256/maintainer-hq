name: Dependency maintenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - name: Verify application
        run: npm run check
      - name: Install the cover browser
        run: npx playwright install --with-deps chromium
      - name: Build and capture the project cover
        run: npm run capture:cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7
      - name: Inspect overrides and upstream releases
        run: npm run --silent dependencies:report -- --upstream > dependency-report.json
      - name: Audit application dependencies
        run: npm audit --audit-level=high
      - name: Retain bounded lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-lifecycle
          path: dependency-report.json
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install application dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install documentation dependencies
        working-directory: site
        run: npm ci --ignore-scripts --no-fund
      - name: Verify documentation
        working-directory: site
        run: npm run check
      - name: Audit documentation dependencies
        working-directory: site
        run: npm audit --audit-level=high

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [lifecycle, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: docs/screenshots
      - name: Open an automatically merged cover pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          branch="automation/project-cover-${GITHUB_SHA}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "$branch"
            changed_paths="$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD)"
            test "$changed_paths" = docs/screenshots/cover.png
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/screenshots/cover.png
            git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
            git push origin "HEAD:$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            body_file="$RUNNER_TEMP/cover-pr.md"
            cat > "$body_file" <<EOF
          Refresh the project cover from the verified source build. This pull request changes only the generated screenshot.

          Capture: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            pr_url="$(gh pr create --base main --head "$branch" --title 'docs: refresh generated project cover' --body-file "$body_file")"
          fi
          gh workflow run dependency-maintenance.yml --ref "$branch"
          gh pr merge "$pr_url" --auto --squash
